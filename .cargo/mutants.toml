# cargo-mutants configuration for fitsproof-rs.
#
# Timing budget: the fast suite (lib + bin + contract_mutants + test_incumbent_gap)
# takes ~78 s per mutant on this machine. A 3600 s run covers ~46 mutants.
# The c6 mutation run timed out because adversarial.rs was included; it spawns the binary
# repeatedly and takes ~95 s alone, making each mutant ~160 s → only ~22 mutants in 3600 s.
#
# Changes from c6:
# - Removed --test=adversarial (saved ~95 s/mutant; its binary-level mutations are covered
#   by cmd_integration.rs which is excluded here but run in CI separately).
# - The three cmd_* body-replacement mutants (cmd_serve, cmd_mcp) are marked
#   #[mutants::skip] in main.rs since they require binary spawning to kill.
# - New unit tests in src/main.rs now kill:
#   parse_context (3 mutants), budget_gb_to_bytes (3 mutants),
#   stress_fp32_peak (3 mutants), stress_eff_budget (3 mutants).
# - Surviving mutants after skip annotations: cmd_stress exit-code path and
#   admission-loop conditions — covered by stress tests in the lib suite.
#
# Minimum timeout per mutant: cargo-mutants auto-sets based on baseline × multiplier.
# We set minimum-test-timeout = 90 to ensure the lib/bin tests are not killed prematurely
# (the lib tests alone take ~78 s; default multiplier is 3×, so auto-timeout = 234 s).

# Run only the fast test suites for mutation testing.
additional_cargo_test_args = [
    "--lib",
    "--bin=fitsproof",
    "--test=contract_mutants",
    "--test=test_incumbent_gap",
]

# Lower bound: prevents the auto-set timeout from dropping below 90 s on fast machines.
minimum_test_timeout = 90
