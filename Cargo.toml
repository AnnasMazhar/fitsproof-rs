[package]
name = "fitsproof-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "fitsproof, compiled: enforce an LLM memory budget with a byte-counting allocator and prove it"
license = "MIT"
repository = "https://github.com/AnnasMazhar/fitsproof-rs"
readme = "README.md"

[[bin]]
name = "fitsproof"
path = "src/main.rs"

[lib]
name = "fitsproof"
path = "src/lib.rs"

[dependencies]
# serde for serialising MachineProfile/AdmitRecord to JSON
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[dev-dependencies]
# No network at test time — only dev deps used in tests

[profile.release]
lto = true
codegen-units = 1
strip = true
