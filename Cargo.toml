[package]
name = "fitsproof-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "fitsproof, compiled: enforce an LLM memory budget with a byte-counting allocator and prove it"
license = "MIT"
repository = "https://github.com/AnnasMazhar/fitsproof-rs"
readme = "README.md"
keywords = ["llm", "memory", "inference", "gguf", "oom"]
categories = ["command-line-utilities", "development-tools::testing", "memory-management"]

[[bin]]
name = "fitsproof"
path = "src/main.rs"

[lib]
name = "fitsproof"
path = "src/lib.rs"

[dependencies]
# serde for serialising MachineProfile/AdmitRecord to JSON
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
# Zero-cost attribute crate for #[mutants::skip] — tells cargo-mutants to skip a function.
# The attribute has no effect on compiled code; it only flags the item for cargo-mutants.
# Must be a regular dependency (not dev-dependency) because annotations appear on non-test code.
mutants = "0.0.4"

[[test]]
name = "test_incumbent_gap"
path = "tests/value/test_incumbent_gap.rs"

[[test]]
name = "adversarial"
path = "tests/adversarial.rs"

[[test]]
name = "contract_mutants"
path = "tests/contract_mutants.rs"

[dev-dependencies]
# Property-based testing (Hypothesis analogue for Rust).
# Properties come from the method's assumptions, not the implementation.
proptest = "1.4.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
